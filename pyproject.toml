[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "memglide"
version = "0.1.0"
description = "Local-first context intelligence for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.143.2", "uvicorn==0.42.0", "pydantic==2.12.5",
  "mcp==2.3.0", "tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2", "watchdog==6.0.0", "pathspec==1.0.4",
  "typer==0.24.1", "rich==14.3.3"
]

[project.scripts]
memglide = "memglide.cli:app"
memglide-codex = "memglide.integrations.codex_preload:main"

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "httpx==0.28.1", "ruff==0.15.7", "mypy==1.19.1", "build==1.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/memglide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# Preserved benchmark oracles and recovery scripts are immutable evidence.
extend-exclude = ["benchmarks/evidence", "benchmarks/automatic-fixtures", "benchmarks/automatic-v2-fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.hatch.build]
artifacts = ["src/memglide/web/**"]

[tool.hatch.build.targets.sdist]
# Ship benchmark code and its inputs, not generated reports or evidence archives.
# The retained historical reports are frozen inputs to the automatic/workflow runners.
include = [
  "/src", "/frontend", "/scripts", "/tests", "/examples", "/docs",
  "/*.md", "/LICENSE", "/uv.lock", "/pyproject.toml", "/.python-version", "/.gitignore",
  "/benchmarks/*.py", "/benchmarks/.ruff.toml",
  "/benchmarks/README.md", "/benchmarks/*protocol*.md", "/benchmarks/*protocol*.json",
  "/benchmarks/tasks*.json", "/benchmarks/automatic*-fixtures/**",
  "/benchmarks/automatic-v[34]-grading.json", "/benchmarks/automatic-v[34]-provenance.json",
  "/benchmarks/controls_automatic_v4.json", "/benchmarks/cost-pricing.json",
  "/benchmarks/refinement_holdout.json", "/benchmarks/retrieval_holdout.json",
  "/benchmarks/warm-80-analysis.json",
  "/benchmarks/codex-workflow-ab.json", "/benchmarks/codex-workflow-ab.md",
  "/benchmarks/workflow-assessment.json", "/benchmarks/workflow-assessment.md",
  "/benchmarks/workflow-contract-issue.json", "/benchmarks/workflow-contract-issue.md",
  "/benchmarks/evidence/README.md",
  "/research/README.md",
]
